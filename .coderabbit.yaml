# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit 자동 리뷰 설정.
#
# **대시보드에서 설정하지 말고 이 파일에서 한다.** 리뷰 로그의
# "Configuration used: Path: .coderabbit.yaml" 이 이 파일이 적용됨을 보여준다.
# 대시보드 설정은 팀원에게 보이지 않고 PR 리뷰도 받을 수 없다.
#
# 규칙 본문은 CONTRIBUTING.md · CLAUDE.md 에 있고, 아래 knowledge_base 로 읽힌다.
# path_instructions 에는 **"이 경로에서만" 이 필요한 것**만 남긴다 — 문서에 이미
# 적힌 규칙을 여기 복사하면 문서가 바뀔 때 조용히 어긋난다.

language: ko-KR

tone_instructions: >
  한국어로 간결하게 리뷰한다. 스타일 지적은 하지 않는다 — 포매터 설정이 정답이다
  (CONTRIBUTING §6). 규칙 위반, 결정론성 위반, 실패 메시지 품질에 집중한다.
  린트·타입체크·테스트·빌드는 CI 가 이미 머지를 막으므로 중복해서 지적하지 않는다.

knowledge_base:
  code_guidelines:
    enabled: true
    # 팀 규칙의 원본. 문서를 고치면 리뷰 기준도 따라 바뀐다.
    filePatterns:
      - "CONTRIBUTING.md" # 팀 헌장 — 소유권·동결·PR·품질 게이트·릴리스·의존성 정책
      - "CLAUDE.md" # 매 세션 지켜야 할 것 — 결정론성, 실패 메시지, 의존 방향
      - "docs/adr/*.md" # 확정된 설계 결정
      - "docs/architecture.md" # 패키지 경계와 병렬 작업 방식
  learnings:
    # public 저장소이므로 auto 는 repo 단위(local)로 동작한다.
    scope: auto

reviews:
  # quiet < chill(기본) < assertive.
  # assertive 로 뒀더니 "6개 고치니 8개 더" 가 되어 팀원이 리뷰를 읽지 않게 됐다.
  # 아무도 안 읽는 리뷰어는 0점이므로 기본값으로 내린다. 규칙 위반 탐지는
  # knowledge_base 와 path_instructions 가 담당하므로 이 값과 무관하다.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  # 워크스루(변경 파일 요약 표 · 시퀀스 다이어그램 · 리뷰 난이도 추정)를 펼쳐서 보여준다.
  # 접어두면 클릭해야 보이는데, 그러면 아무도 안 본다.
  collapse_walkthrough: false

  path_filters:
    - "!**/dist/**"
    - "!pnpm-lock.yaml"

  # 아래 항목은 전부 "해당 경로에서만 성립하는 것" 이다.
  # 전역 규칙(결정론성 · 의존 방향 · 실패 메시지 품질 · 파트 경계 · 의존성 정책)은
  # knowledge_base 가 CONTRIBUTING·CLAUDE.md 에서 직접 읽는다.
  path_instructions:
    - path: "packages/core/src/types.ts"
      instructions: >
        이 파일 하나만 동결 대상이다 (CONTRIBUTING §3). McpClient / ToolDef / ToolResult 에
        어떤 변경이든 있으면 반드시 지적하고, PR 제목의 [BREAKING] 표기와 영향받는 파트
        전원의 승인 여부를 확인하라. 같은 패키지의 다른 파일에는 이 규칙을 적용하지 마라.

    - path: "packages/record/**"
      instructions: >
        녹화 파일에 인증 헤더·토큰·API 키가 섞여 커밋될 수 있는 경로가 있으면 반드시
        지적하라. 마스킹 규칙 수립은 이 패키지 오너의 명시적 책임이다 (CONTRIBUTING §13.5).
        다른 패키지에는 해당하지 않는다.

    - path: "packages/mock/**"
      instructions: >
        목 서버는 stateless 로 뜬다. sessionIdGenerator 에 randomUUID 등을 넣어 stateful
        로 바꾸려는 변경은 결정론성을 깨므로 지적하라. 요청 매칭 키는 객체 키 순서에
        영향받지 않아야 한다 (ADR-0005).

    - path: "packages/cli/**"
      instructions: >
        cli 는 공동 소유이며 얇게 유지한다. 각자 자기 파트의 서브커맨드만 수정한다.
        한 PR 이 여러 파트의 서브커맨드를 동시에 건드리면 지적하라. 실제 로직이 여기
        들어오면 각 패키지로 옮기라고 지적하라.

    - path: ".github/workflows/**"
      instructions: >
        필수 상태 체크는 verify(20/22/24) 와 build 다. 이 잡의 이름이 바뀌면 main 보호
        규칙이 조용히 무력화되므로 반드시 지적하라. build 잡이 Node 22 전용인 것은
        의도된 것이다 (tsdown 의 engines 제약, ci.yml 주석 참조).

  # Finishing Touches — 리뷰 외에 코드를 만들어내는 기능들.
  #
  # unit_tests 만 끈다. 이것만 **사람이 요청하지 않아도 스스로 PR 을 연다**
  # (#21 이 그렇게 열렸고 CI 가 깨진 채였다. vitest.config.ts 까지 건드렸다).
  #
  # autofix · fix_ci 는 켜 둔다. 둘 다 체크박스나 @coderabbitai 명령으로
  # **사람이 눌러야** 움직이므로 저절로 히스토리를 오염시키지 않는다.
  # 다만 `@coderabbitai fix-ci commit` 은 현재 브랜치에 직접 커밋하므로 쓰지 않는다
  # — §12 는 "그 패키지의 커밋 대부분이 내 것" 을 개인 기여 증거로 요구한다.
  # 별도 PR 을 여는 `@coderabbitai fix-ci` 는 리뷰를 거치므로 괜찮다.
  finishing_touches:
    unit_tests:
      enabled: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

chat:
  auto_reply: true
