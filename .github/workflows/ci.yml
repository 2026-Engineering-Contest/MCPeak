name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 린트 · 타입체크 · 테스트는 지원 대상 런타임 전부에서 돌린다.
    # 이 잡이 "사용자 환경에서 동작한다"를 보증한다 (CONTRIBUTING §6).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 선언한 최소 버전 자체를 검사해야 최신 22.x에서만 우연히 통과하는 일을 막는다.
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    # 실서버(`mcp-server-fetch`)를 띄우는 E2E 다. verify 와 나눈 이유가 두 가지다.
    #
    # 1) verify 는 `uv` 가 없어도 돌아야 한다. 기여자 노트북에 Python 도구 체인을
    #    요구하지 않는다. 그래서 그쪽은 skip 을 허용하고, 여기서만 승격 스위치를 켠다.
    # 2) verify 는 Node 22.18/24 매트릭스라 여기 붙이면 E2E 가 2회 돈다. 프로세스
    #    spawn · stdio 왕복 · 종료처럼 Node 버전에 민감한 층은 이미
    #    packages/core/tests/stdio-integration-e2e.test.ts 가 두 버전 모두에서 본다.
    #    이 잡이 추가로 보는 것은 상대가 Python 프로세스라는 점 하나다 (ADR-0037).
    #
    # OHMYMCP_REQUIRE_E2E=1 은 "uvx 가 없으면 skip 하지 말고 실패해라" 다. 이 잡에서
    # 아래 setup-uv 가 조용히 깨지면 E2E 는 안 돌지만 결과는 초록이 된다. 그 침묵을
    # 막는 것이 이 변수의 존재 이유다 (이슈 #153).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 액션은 커밋 SHA 로 고정한다. 태그는 옮겨 달 수 있어 CI 가 말없이 바뀐다.
      # astral-sh/setup-uv v10.0.1 · MIT (프로젝트와 동일 라이선스).
      #
      # 여기서 까는 것은 `uv` 뿐이다. Python `mcp` 의 버전 고정은 테스트 안에서
      # `uvx --with "mcp<2"` 로 한다. `mcp` 2.x 는 McpError 임포트가 깨져 서버가
      # 시작조차 못 하고, 그것을 우리 도구 결함으로 오진하기 쉽다
      # (docs/adoption.md §1.5). 그 고정을 여기로 옮기지 마라.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install
        run: pnpm install --frozen-lockfile

      # 이 파일만 돌린다. 나머지 스펙은 verify 잡이 세 런타임에서 이미 본다.
      - name: Real-server E2E
        env:
          OHMYMCP_REQUIRE_E2E: "1"
        run: pnpm vitest run packages/cli/tests/fetch-server-e2e.test.ts

  build:
    # 빌드만 별도 잡으로 분리한다.
    #
    # 번들러(tsdown 0.22)가 engines.node 를 "^22.18.0 || >=24.11.0" 으로 선언한다.
    # verify 잡은 사용자 최소 런타임 22.18.0을 정확히 검사하고, 빌드는 최신 22.x에서
    # 수행한다. 산출물의 TypeScript target은 ES2022로 유지한다(ADR-0054).
    runs-on: ubuntu-latest
    # Publish JUnit report 스텝은 use-actions-summary 기본값(true)으로 동작해
    # 리포트를 Actions job summary 에 쓴다. Check Run 을 만들지 않으므로
    # checks: write 가 필요 없다 — 읽기 권한만 연다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 빌드가 성공했다는 것과 산출물이 실제로 도는 것은 다르다.
      # 이 스텝은 dist/cli.mjs 를 그대로 실행해 examples/weather-server 를 테스트한다.
      # vitest 쪽(cli-integration-e2e.test.ts)은 소스를 돌리므로 번들링·exports·shebang
      # 문제를 잡지 못한다 — 그것들은 배포 후에야 드러난다 (CONTRIBUTING §6).
      - name: Verify built CLI
        run: pnpm --filter @mcpeak/cli test:e2e

      # `verify` 잡은 빌드 없이 돌고, vitest alias 가 워크스페이스 패키지를 소스로 해석한다.
      # 그래서 `exports` 경로나 빌드 레이아웃이 어긋나도 그쪽은 초록이다. 사용자가 받는 것은
      # dist 이므로 빌드가 끝난 이 자리에서 한 번 밟는다.
      #
      # 특히 external 의 자식 bootstrap 은 번들되지 않고 URL 로 로드된다. 레이아웃이 바뀌면
      # Coordinator 가 가리킬 파일이 사라져 자식이 기동조차 못 하는데, 타입체크도 테스트도
      # 초록인 채로 배포본만 깨진다.
      - name: Verify built record external subpath
        run: pnpm --filter @mcpeak/record test:e2e

      # "우리 도구로 우리를 검증한다" 의 마지막 한 칸이다 (CLAUDE.md).
      #
      # 위 스텝은 CLI 가 도는지만 본다. 이 스텝은 그 결과를 --junit 으로 내보내
      # 실제 CI 리포터에 물린다. 우리가 내보낸 XML 을 우리 CI 가 읽지 못하면
      # 사용자의 CI 도 읽지 못한다 — 그것을 배포 전에 알아야 한다.
      #
      # ADR-0016 이 "검증되지 않은 가정" 으로 남긴 time="0" 항목이 여기서 실측된다.
      # 리포터가 이 XML 을 정상 파싱하면 A안(속성을 0 으로 고정)이 확인되고,
      # 거부하거나 이상하게 표시하면 그 ADR 을 재검토한다.
      - name: Export JUnit report from examples/weather-server
        run: |
          node packages/cli/dist/cli.mjs test \
            packages/cli/tests/fixtures/weather-suite.json \
            --command node \
            --arg examples/weather-server/server.mjs \
            --junit junit-dogfood.xml

      # 액션은 커밋 SHA 로 고정한다. 태그는 옮겨 달 수 있어 CI 가 말없이 바뀐다.
      # dorny/test-reporter v3.0.0 · MIT (프로젝트와 동일 라이선스).
      #
      # v3.0.0 은 annotated tag 라 `git/ref/tags` 의 object.sha 는 커밋이 아니라
      # tag object 를 가리킨다. 여기 적는 것은 그 tag 가 가리키는 **커밋** SHA 다.
      #
      # if 조건 — 위 스텝이 실패해도 XML 은 이미 쓰여 있고, 실패한 회차야말로
      # 리포트가 필요한 회차다. 다만 always() 는 취소된 실행에서도 참이라
      # 종료 중인 워크플로가 리포트를 하나 더 남긴다. !cancelled() 는 실패 뒤에는
      # 돌고 취소 뒤에는 건너뛴다.
      - name: Publish JUnit report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: dogfood (examples/weather-server)
          path: junit-dogfood.xml
          reporter: java-junit
          # 리포트를 이 워크플로 run 의 job summary 에 싣는다. false 로 두면 대신
          # Check Run 을 만들고 잡에 checks: write 가 필요해진다. 실패는 바로 위
          # export 스텝이 build 잡을 빨갛게 만들어 이미 드러나므로, 체크 항목과
          # 권한을 늘리지 않는 쪽을 택했다. 기본값과 같지만 명시한다 —
          # 이 값이 위 permissions 블록과 맞물려 있어 조용히 바뀌면 안 된다.
          use-actions-summary: true
          # 실패한 케이스가 있어도 이 스텝 자체는 실패로 두지 않는다. 판정은 위
          # export 스텝의 종료 코드가 이미 했고, 여기서 또 실패시키면 같은 실패가
          # 두 번 빨갛게 뜬다. 이 스텝은 관측 수단이지 판정 수단이 아니다.
          #
          # fail-on-empty 는 기본값(true)으로 둔다. XML 이 아예 없는 것은 관측
          # 실패가 아니라 리포터가 깨진 것이므로 알아야 한다.
          fail-on-error: false

  changeset-check:
    # 기능 PR에 changeset이 없으면 **실패시킨다**(ADR-0063).
    #
    # 한때 경고만 남겼다. 그 결과 External Record/Replay 기능 전체가 changeset 없이 PR 4개로
    # 나갔고(#234·#245·#247·#249), 새 공개 서브패스와 CLI 플래그 둘이 CHANGELOG 에 한 줄도
    # 없이 발행될 뻔했다. 잡아낸 것은 CI 가 아니라 릴리스 직전에 사람이 대기 changeset 을
    # 눈으로 센 것이었다 — 읽히지 않는 경고는 없는 것과 같다(#264).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `||` 로 삼키지 않는다. 그 한 글자가 "탐지했지만 SUCCESS 로 찍는" 상태를 만들었다.
      - name: Require a changeset
        run: |
          pnpm changeset status --since=origin/${{ github.base_ref }} || {
            echo "::error::changeset 이 없습니다. 'pnpm changeset' 으로 릴리스 노트를 추가하세요."
            echo "::error::릴리스가 필요 없는 변경이면 'pnpm changeset add --empty' 로 빈 changeset 을 넣으세요."
            exit 1
          }
