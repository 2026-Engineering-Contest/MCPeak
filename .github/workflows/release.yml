name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm provenance 발행용. OIDC 로 이 워크플로의 신원을 증명해 npm 에 서명된
  # 빌드 출처를 남긴다 (CONTRIBUTING §7 "장기 토큰 대신 OIDC 를 우선 검토한다").
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ── 배포 전 마지막 방어선 (ADR-0043) ──────────────────────────────────────
      #
      # `npm pack` 은 `workspace:*` 를 실제 버전으로 치환하지 않는다. `pnpm pack` 만 한다.
      #
      # changesets 2.31.1 의 `getPublishTool()` 은 `package-manager-detector` 가 pnpm 을
      # 감지하지 못할 때만 npm 을 고른다. 감지 후 `pnpm --version` 실행이 실패해도 catch 가
      # pnpm 을 그대로 돌려주므로, PATH 문제로 npm 으로 넘어가는 경로는 없다. 위험은
      # **감지 실패** 한 갈래로 한정된다 — 락파일 누락, 워크스페이스 인식 실패, 상위 버전에서
      # 감지 로직 변경.
      #
      # 그 경우 `"@mcpeak/core": "workspace:*"` 가 그대로 npm 에 올라간다. 아무도 설치할
      # 수 없고, unpublish 해도 같은 이름·버전으로 다시 올릴 수 없다.
      #
      # 그래서 감지를 믿지 않고 실제 tarball 을 만들어 그 안의 package.json 을 검사한다.
      - name: "Guard — tarball 에 workspace: 프로토콜이 남았는지 검사"
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          for dir in packages/*/; do
            (cd "$dir" && pnpm pack --pack-destination "$stage" >/dev/null)
          done

          checked=0
          bad=0
          for tgz in "$stage"/*.tgz; do
            checked=$((checked + 1))
            manifest="$(tar -xzOf "$tgz" package/package.json)"
            if printf '%s' "$manifest" | grep -q '"workspace:'; then
              echo "::error::$(basename "$tgz") 의 package.json 에 workspace: 의존이 남아 있습니다. 이대로 배포하면 설치할 수 없는 패키지가 npm 에 영구히 남습니다."
              printf '%s' "$manifest" | grep -n '"workspace:'
              bad=$((bad + 1))
            fi
          done

          # 0 건은 "깨끗함"이 아니라 "검사를 안 했음"일 수 있다. 건수를 따로 확인한다.
          if [ "$checked" -eq 0 ]; then
            echo "::error::검사한 tarball 이 0 개입니다. packages/*/ 경로나 pnpm pack 을 확인하세요."
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "::error::배포를 중단합니다 — workspace: 가 남은 패키지 ${bad}/${checked} 개."
            exit 1
          fi
          echo "tarball ${checked} 개 검사 완료 — workspace: 잔존 없음"

      # changesets 액션은 대기 중인 changeset 이 있으면 **버전 PR** 을 만들고,
      # 하나도 없으면 아직 배포되지 않은 패키지를 **배포**한다. 두 동작 모두 이 스텝이다.
      #
      # ⚠️ 그래서 changeset 이 비어 있는 상태로 main 에 push 하면 그 시점의 버전이
      # 그대로 npm 에 나간다. 위 Guard 가 형식 오류는 잡지만 "낼 생각이 없던 버전을
      # 낸 것"은 잡지 못한다 — 버전 PR 머지 외의 경로로 main 을 건드릴 때 유의한다.
      - name: Create Release Pull Request / Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 토큰 값은 여기에 넣지 않는다 — 저장소 시크릿으로만 참조한다.
          #
          # 두 이름으로 같은 시크릿을 넣는 이유가 다르다.
          #   NODE_AUTH_TOKEN — setup-node 가 만든 .npmrc 가 이 이름을 참조한다.
          #   NPM_TOKEN       — changesets/action 이 이 이름을 직접 읽는다.
          #
          # NPM_TOKEN 이 없으면 changesets/action 은 "No NPM_TOKEN found, but OIDC is
          # available" 로 판단해 **npm trusted publishing(OIDC)** 으로 갈아탄다.
          #
          # 2026-08-20 에 `@mcpeak/*` 일곱 개가 그 경로로 나갔고 **정상 발행됐다.** 당시
          # 발행 직후 몇 분간 레지스트리 조회가 404 여서 무발행으로 오진하고 이 줄을
          # 추가했는데, 원인은 OIDC 가 아니라 전파 지연이었다. 즉 **이 줄은 그때 문제를
          # 고친 것이 아니다.**
          #
          # 그래도 남겨 둔다. OIDC 는 npm 쪽 trusted publisher 등록에 의존하므로 새 패키지나
          # 새 스코프에서 실패할 여지가 있고, 토큰 경로를 명시해 두면 그 분기를 타지 않는다.
          # 되돌릴 수 없는 발행에서는 경로가 하나로 고정된 편이 낫다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # changesets 는 --provenance 를 자동으로 붙이지 않는다. 이 환경변수가 있어야
          # 위 id-token 권한이 실제로 쓰인다. 둘 중 하나만 있으면 provenance 는 안 켜진다.
          NPM_CONFIG_PROVENANCE: "true"

      # 발행했다고 **보고한** 것과 레지스트리에 **있는** 것을 대조한다.
      #
      # changesets 가 "published successfully" 를 찍고 git 태그까지 밀어도 그것은 **보고**일
      # 뿐이다. 발행이 되돌릴 수 없는 작업인 만큼 보고를 믿지 않고 결과를 직접 조회한다.
      #
      # 2026-08-20 에는 반대 방향의 오진이 있었다 — 발행은 성공했는데 전파 지연으로 몇 분간
      # 404 가 보였고, 그것을 무발행으로 읽었다. 그래서 아래 `lookup` 의 대기를 넉넉히 잡는다.
      # 이 Guard 가 짧게 포기하면 **성공한 릴리스를 빨갛게** 만들어 오진을 자동화한다.
      #
      # 발행을 되돌릴 수는 없으므로 이 스텝은 "막는 관문"이 아니라 "거짓 초록을 없애는
      # 경보"다. 실패하면 사람이 재실행 여부를 판단한다.
      #
      # **발행 경로에서만 돈다.** 위 액션은 changeset 이 있으면 버전 PR 을 만들고 발행하지
      # 않는데, 그때도 `changeset version` 이 러너의 package.json 버전을 올린다. 그 버전은
      # 아직 npm 에 없는 것이 정상이므로 무조건 대조하면 버전 PR 이 만들어질 때마다
      # 릴리스가 빨개진다. `published` 출력으로 두 경로를 가른다.
      #
      # 이번 사고처럼 액션이 발행했다고 **보고만** 한 경우에도 `published` 는 true 라서
      # 이 Guard 가 돈다 — 잡으려는 것이 정확히 그 경우다.
      - name: Guard — 발행 결과를 레지스트리에서 확인
        if: ${{ always() && steps.changesets.outputs.published == 'true' }}
        run: |
          set -uo pipefail

          # 갓 발행된 버전이 레지스트리 조회에 뜨기까지 **분 단위**로 걸릴 수 있다.
          #
          # 2026-08-20 에 `@mcpeak/*` 일곱 개를 발행한 직후 `npm view` 와 캐시를 우회한
          # `curl` 이 모두 몇 분 동안 404 를 돌려줬다. 발행은 성공한 상태였는데 그것을
          # 무발행으로 오진해 워크플로를 고치는 PR(#216)까지 냈다. 재시도가 짧으면 이
          # Guard 가 같은 오진을 자동화해 **성공한 릴리스를 빨갛게** 만든다.
          #
          # 그래서 넉넉히 잡는다. 최대 3 분이며, 대부분은 첫 시도에 끝난다.
          # 진짜 무발행이면 3 분 뒤에도 없으므로 이 대기로 가려지지 않는다.
          lookup() {
            for attempt in $(seq 1 7); do
              npm view "$1" version >/dev/null 2>&1 && return 0
              if [ "$attempt" -lt 7 ]; then
                echo "    … ${1} 미확인, 30초 후 재시도 (${attempt}/6)"
                sleep 30
              fi
            done
            return 1
          }

          checked=0
          missing=0
          for dir in packages/*/; do
            manifest="$dir/package.json"
            [ -f "$manifest" ] || continue
            private="$(node -p "require('./$manifest').private === true")"
            [ "$private" = "true" ] && continue

            name="$(node -p "require('./$manifest').name")"
            version="$(node -p "require('./$manifest').version")"
            checked=$((checked + 1))

            if lookup "${name}@${version}"; then
              echo "  ✓ ${name}@${version}"
            else
              echo "::error::${name}@${version} 이 레지스트리에 없습니다. 발행이 보고와 다릅니다."
              missing=$((missing + 1))
            fi
          done

          # 0 건은 "전부 통과"가 아니라 "검사를 안 했음"이다. 위 tarball Guard 와 같은 이유다.
          if [ "$checked" -eq 0 ]; then
            echo "::error::검사한 패키지가 0 개입니다. packages/*/ 경로를 확인하세요."
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::${checked} 개 중 ${missing} 개가 레지스트리에 없습니다."
            exit 1
          fi
          echo "패키지 ${checked} 개 전부 레지스트리에서 확인됨"
